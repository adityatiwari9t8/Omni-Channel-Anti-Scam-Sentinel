<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
  <title>Sentinel Pipeline Replay Harness</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #f1f5f9;
      max-width: 1100px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
    input[type="file"], input[type="range"], select {
      width: 100%;
      margin-bottom: 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button:hover { background: #3b82f6; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .badge-clear { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-suspicious { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-challenge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-alert { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .badge-no-data { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid #94a3b8; }
    canvas#chart {
      width: 100%;
      height: 200px;
      background: #090d16;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .log-box {
      margin-top: 12px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      height: 160px;
      overflow-y: auto;
      color: #94a3b8;
    }
    .nav-link { color: #60a5fa; font-size: 13px; text-decoration: none; margin-bottom: 12px; display: inline-block; }
  </style>
</head>
<body>
  <a class="nav-link" href="index.html">← Back to Self-Test</a>
  <h1>Sentinel Pipeline Replay Harness</h1>
  <p>Play a local clip through the Sentinel pipeline, tune audio, sync, and visual weights, then export the run log.</p>

  <div class="layout">
    <div class="panel">
      <video id="player" controls playsinline></video>
      <label>Choose Video/Audio Clip (.mp4, .webm, .wav)</label>
      <input type="file" id="clipPicker" accept="video/*,audio/*" />

      <label>Detection Sensitivity</label>
      <select id="sensitivity">
        <option value="medium">Medium (Standard)</option>
        <option value="low">Low (Conservative)</option>
        <option value="high">High (Strict)</option>
      </select>

      <label>Audio Weight: <span id="wAudioVal">0.50</span></label>
      <input type="range" id="wAudio" min="0" max="1" step="0.05" value="0.5" />

      <label>Sync Weight: <span id="wSyncVal">0.50</span></label>
      <input type="range" id="wSync" min="0" max="1" step="0.05" value="0.5" />

      <label>Visual Model Weight: <span id="wVisionVal">0.35</span></label>
      <input type="range" id="wVision" min="0" max="1" step="0.05" value="0.35" />

      <div>
        <button id="startBtn">Start Pipeline</button>
        <button id="stopBtn" class="secondary">Stop</button>
      </div>

      <div style="margin-top: 8px;">
        <button id="exportJsonl" class="secondary">Export JSONL</button>
        <button id="exportCsv" class="secondary">Export CSV</button>
      </div>
    </div>

    <div class="panel">
      <div>Current Arbiter State:</div>
      <div id="statusBadge" class="status-badge badge-no-data">NO DATA</div>
      <div id="reasons" style="font-size: 12px; color: #cbd5e1; margin-bottom: 12px;">Waiting for clip playback...</div>

      <label>Real-Time Scores Timeline</label>
      <canvas id="chart" width="700" height="200"></canvas>

      <label style="margin-top: 12px;">Telemetry Log Stream</label>
      <div id="logBox" class="log-box"></div>
    </div>
  </div>

  <script type="module" src="replay.js"></script>
</body>
</html>
